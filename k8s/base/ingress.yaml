apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-greeter
  namespace: greeter
  labels:
    app.kubernetes.io/name: aegis-greeter
    app.kubernetes.io/part-of: aegis-stateless
  annotations:
    # AWS Load Balancer Controller — provisions an internet-facing ALB,
    # routing to pods directly (target-type ip; no NodePort hop).
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # ALB access logs → S3 bucket provisioned in the platform/ TF env.
    # The actual bucket name is environment-specific; the overlay or a
    # regional-stack-injected ConfigMap supplies it. Placeholder here.
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      access_logs.s3.enabled=true
    # external-dns (deferred — see regional-stack module README): when
    # installed, this annotation drives a Route 53 A-alias record under
    # the platform-owned hosted zone.
    external-dns.alpha.kubernetes.io/hostname: greeter.aegis-stateless.test
spec:
  ingressClassName: alb
  rules:
    - host: greeter.aegis-stateless.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-greeter
                port:
                  name: http
